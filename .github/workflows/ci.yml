name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so dependency advisories surface even when nothing is pushed.
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: bandit -q -r src -c pyproject.toml
      # `.` not the editable install: pip-audit --strict cannot resolve an
      # editable install of the project itself on PyPI and exits 1.
      - run: pip-audit --strict --desc on .

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest

  invariants:
    name: review invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Framework references are complete and well formed
        # These reach GRC trackers and renewal conversations, where somebody
        # looks them up. A blank or malformed identifier is worse than none.
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, sys
          from vendorreview.controls.catalog import BUILTIN_CONTROLS
          expected = {"NIST CSF 2.0", "ISO 27001:2022", "SOC 2 TSC", "CIS v8"}
          patterns = {
              "NIST CSF 2.0": re.compile(r"^(GV|ID|PR|DE|RS|RC)\.[A-Z]{2}$"),
              "ISO 27001:2022": re.compile(r"^A\.[5-8]\.\d{1,2}$"),
              "SOC 2 TSC": re.compile(r"^(CC[1-9]\.\d|A\d\.\d|C\d\.\d|P\d\.\d|PI\d\.\d)$"),
              "CIS v8": re.compile(r"^Control (1[0-8]|[1-9])$"),
          }
          for entry in BUILTIN_CONTROLS:
              names = {f.name for f in entry.frameworks}
              if names != expected:
                  sys.exit(f"{entry.id} maps to {names}, expected all four")
              for f in entry.frameworks:
                  if not patterns[f.name].match(f.identifier):
                      sys.exit(f"{entry.id}: malformed {f.name} identifier {f.identifier!r}")
                  if not f.title:
                      sys.exit(f"{entry.id}: {f.identifier} has no title")
          print(f"{len(BUILTIN_CONTROLS)} objectives, all four frameworks, all identifiers well formed")
          PY

      - name: The decision is never read from model output
        run: |
          set -euo pipefail
          if grep -rn 'raw.get("decision")\|raw\[.decision.\]\|get("severity")\|get("blocks_decision")\|get("blocking")' src/vendorreview/; then
            echo "::error::a model-supplied decision, severity or blocking flag is being read"
            exit 1
          fi
          python - <<'PY'
          import sys
          from vendorreview.controls.evaluate import decide, evaluate
          from vendorreview.intake import parse_intake
          from vendorreview.models import Question
          from vendorreview.review import _merge_questions
          intake = parse_intake({"vendor": "V", "service": "holds the attendee list",
                                 "data_classes": ["personal data"], "dpa_status": "no"})
          gaps, questions, _, _, _ = evaluate(intake)
          first, _ = decide(gaps, questions, [])
          second, _ = decide(gaps, questions, [])
          if first is not second:
              sys.exit("the decision is not reproducible")
          if first.value != "do_not_proceed":
              sys.exit(f"expected do_not_proceed for a blocking engagement, got {first.value}")
          # A blocking question is what turns an approval into
          # more-information-needed and what makes the exit code 1, so nothing
          # arriving from the analysis layer may set one.
          merged = _merge_questions([], [Question(text="q", blocks_decision=True, trusted=False)])
          if any(q.blocks_decision for q in merged):
              sys.exit("a question from the analysis layer was allowed to block the decision")
          print(f"decision computed and reproducible: {first.value}")
          PY

      - name: Not evidenced is never treated as absent
        # The failure mode that ends adoption: accusing a vendor of something
        # nobody asked them about, which their security lead disproves in ten
        # minutes.
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from vendorreview.analyze.severity import UNKNOWN_CAP
          from vendorreview.controls.evaluate import evaluate
          from vendorreview.intake import parse_intake
          base = {"vendor": "V", "service": "holds the attendee list",
                  "data_classes": ["personal data"], "hosting": "saas"}
          blank = parse_intake(base)
          gaps, questions, _, _, _ = evaluate(blank)
          scim = [g for g in gaps if g.control_id == "IAM-02"]
          if not scim:
              sys.exit("IAM-02 did not appear at all")
          if scim[0].attestation.value != "not_evidenced":
              sys.exit("a blank SCIM answer was recorded as an absence")
          if scim[0].blocking:
              sys.exit("an unknown was allowed to block")
          if scim[0].severity.rank > UNKNOWN_CAP.rank:
              sys.exit("an unevidenced objective was rated above the unknown cap")
          if not any("SCIM" in q.text for q in questions):
              sys.exit("a blank SCIM answer produced neither a gap nor a question")
          explicit = parse_intake({**base, "scim_available": "no"})
          absent = [g for g in evaluate(explicit)[0] if g.control_id == "IAM-02"]
          if not absent or absent[0].attestation.value != "absent":
              sys.exit("an explicit 'no' did NOT produce an absence")
          # The mirror. Silence must not become an attestation either: `stage` is
          # defaulted for display when the form leaves it blank, and reading that
          # default attested that the review happened before commitment.
          if "GOV-02" in evaluate(blank)[3]:
              sys.exit("an unanswered stage was recorded as an attestation")
          # And a certificate stating a scope is not a certificate stating that
          # its scope covers what is being bought.
          from datetime import date
          from vendorreview.evidence.iso27001 import parse_iso
          from vendorreview.evidence.reader import Document
          from vendorreview.models import EvidenceSet
          from vendorreview.validation import sanitise
          lines = tuple(sanitise(line, limit=1000) for line in (
              "ISO/IEC 27001:2022 Certificate",
              "Scope: reception and facilities services at the Dublin head office.",
              "Expiry: 2029-01-01",
          ))
          with_cert = parse_intake(base)
          with_cert.evidence = EvidenceSet(
              iso=parse_iso(Document(name="c.txt", lines=lines, pages=1), as_of=date(2026, 6, 1))
          )
          if "ATT-07" in evaluate(with_cert)[3]:
              sys.exit("a scope statement was read as proof that the scope covers the service")
          print("blank is a question capped at medium, explicit no is a gap, "
                "and neither a default nor a scope line is an attestation")
          PY

      - name: The gate rejects invented facts and control ids
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from vendorreview.analyze import gate
          from vendorreview.intake import parse_intake
          intake = parse_intake({"vendor": "V", "service": "holds the attendee list"})
          good = {"title": "x", "chain": ["a"], "fact_ids": ["vendor"],
                  "control_ids": ["GOV-01"], "blast": "contained", "data_at_risk": "internal"}
          for bad, label in (
              ({**good, "fact_ids": ["nope"]}, "fact"),
              ({**good, "control_ids": ["ZZZ-99"]}, "control id"),
              ({**good, "chain": []}, "chain"),
          ):
              kept, rejected = gate.apply([bad], intake)
              if kept or not rejected:
                  sys.exit(f"the gate let an invented {label} through")
          kept, rejected = gate.apply([good], intake)
          if not kept or rejected:
              sys.exit("the gate rejected a well-formed finding")
          print("gate rejects invented facts, invented control ids and empty chains")
          PY

      - name: Severity is clamped in both directions
        # Suppression is the half nobody notices: a real risk described as
        # contained is a real risk nobody acts on, and the report looks clean.
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from vendorreview.analyze import gate
          from vendorreview.analyze.severity import MAX_ADJUSTMENT, engagement_adjustment
          from vendorreview.intake import parse_intake
          intake = parse_intake({
              "vendor": "V", "service": "holds customer records",
              "data_classes": ["regulated"], "data_subjects": ["customers"],
              "integrations": [{"pattern": "scim", "name": "Okta"}], "criticality": "critical",
          })
          kept, _ = gate.apply([{
              "title": "talked down", "chain": ["a"], "fact_ids": ["vendor"],
              "control_ids": ["GOV-01"], "blast": "contained", "data_at_risk": "public",
          }], intake)
          if not kept:
              sys.exit("the clamp test finding was rejected outright")
          if kept[0].blast.rank < intake.max_blast().rank - 2:
              sys.exit("a finding was allowed to claim a blast radius far below the engagement")
          if kept[0].data_at_risk.rank < intake.max_data_class().rank - 2:
              sys.exit("a finding was allowed to claim a data class far below the engagement")
          if kept[0].severity.value in {"info", "low"}:
              sys.exit(f"suppression worked: severity came out {kept[0].severity.value}")
          for raw in ({"data_classes": ["regulated"], "criticality": "critical"},
                      {"data_classes": ["public"], "criticality": "routine"}):
              parsed = parse_intake({"vendor": "V", "service": "x", **raw})
              if abs(engagement_adjustment(parsed)) > MAX_ADJUSTMENT:
                  sys.exit("the engagement adjustment exceeded its bound")
          print(f"claims clamped in both directions; severity held at {kept[0].severity.value}")
          PY

      - name: Nothing credential-shaped leaves the boundary
        # The README says credential shapes are redacted before anything is
        # sent. A free-text answer, a bare integration entry and the vendor's own
        # evidence have each broken that claim, and each was one missing call.
        run: |
          set -euo pipefail
          printf 'CI token ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\n' > appendix.txt
          printf 'key_management: "keys at AKIAIOSFODNN7EXAMPLE"\n' > answers.yml
          python - <<'PY'
          import sys
          from vendorreview.analyze.prompt import build_user_message
          from vendorreview.controls.evaluate import evaluate
          from vendorreview.evidence import evidence_facts, load_evidence
          from vendorreview.intake import parse_intake, scrub_intake
          from vendorreview.report import render_html, render_json, render_markdown
          from vendorreview.review import check
          secrets = ["AKIAIOSFODNN7EXAMPLE", "hunter2pass",
                     "ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
          # Zero width means zero width, not the two characters everybody lists.
          # A variation selector inside a key defeated every pattern and rendered
          # to a reader as the intact key.
          invisible = ["\u200b", "\ufe00", "\U000e0041", "\u180e", "\u034f", "\u3164"]
          intake = parse_intake({
              "vendor": "V",
              "service": "holds the attendee list",
              "data_classes": ["personal data", "biometric AKIAIOSFODNN7EXAMPLE"],
              "admin_roles": " ".join(
                  "AKIA" + c + "IOSFODNN7EXAMPLE" for c in invisible
              ),
              "oauth_scopes": "postgres://svc:hunter2pass@db.internal:5432/app",
              "integrations": ["api_key postgres://svc:hunter2pass@db.internal:5432/app"],
          })
          intake.evidence = load_evidence(responses_path="answers.yml")
          intake.facts.extend(evidence_facts(intake.evidence))
          intake.document_lines = open("appendix.txt").read().splitlines()
          intake.document_name = "appendix.txt"
          scrub_intake(intake)
          gaps, _, applicable, _, _ = evaluate(intake)
          result = check(intake)
          sinks = {
              "API payload": build_user_message(intake, gaps, applicable),
              "markdown report": render_markdown(result),
              "json report": render_json(result),
              "html report": render_html(result),
          }
          for name, text in sinks.items():
              stripped = text
              for c in invisible:
                  stripped = stripped.replace(c, "")
              for secret in secrets:
                  if secret in text or secret in stripped:
                      sys.exit(f"{secret!r} reached the {name}")
          print(f"no credential shape reached any of: {', '.join(sinks)}")
          PY

      - name: check runs with no API key
        run: |
          set -euo pipefail
          env -u ANTHROPIC_API_KEY vendorreview check -i vendor.example.yml -o /dev/null -q && rc=0 || rc=$?
          test "$rc" -eq 1 || { echo "expected exit 1 for the example engagement, got $rc"; exit 1; }
          echo "check works with no key and fails an engagement with a blocking gap"

  smoke:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: The example engagement produces the expected decision
        run: |
          set -euo pipefail
          vendorreview check -i vendor.example.yml -o review.md -q || true
          grep -q "Do not proceed" review.md
          grep -q "DAT-05" review.md
          # `grep -qv PATTERN` was here, and it can never fail: -v inverts per
          # line, so it exits 0 as long as ONE line lacks the pattern. The
          # invariant it was meant to hold -- that prose written in this
          # repository is not escaped as though a vendor had typed it -- was
          # unguarded for as long as it was written that way, and the report was
          # in fact printing "finding\(s\)" at the reader.
          if grep -q '\\(' review.md; then
            echo "::error::tool-authored prose was escaped; see report._prose"
            grep -n '\\(' review.md
            exit 1
          fi
          echo "the example review renders correctly"

      - name: Reading the evidence changes the answer
        run: |
          set -euo pipefail
          vendorreview check -i vendor.example.yml \
            --soc2 examples/brightwave-soc2.txt \
            --responses examples/brightwave-responses.yml \
            -o with-evidence.md -q || true
          grep -q "Evidence read: SOC 2, questionnaire responses" with-evidence.md
          # The three lines that decide a real review, and the three nobody
          # reads: a period that has run out, exceptions in the test results,
          # and a subservice organisation carved out of the scope entirely.
          grep -q "ATT-03" with-evidence.md
          grep -q "ATT-04" with-evidence.md
          grep -q "ATT-05" with-evidence.md
          echo "the SOC 2 was read, including the carve-out"

      - name: The requester view carries the decision and no evidence dump
        run: |
          set -euo pipefail
          vendorreview check -i vendor.example.yml --audience requester -o requester.md -q || true
          grep -q "Do not proceed" requester.md
          grep -q "What has to happen before signature" requester.md
          if grep -q "## Not evidenced" requester.md; then
            echo "::error::the requester view is carrying the evidence sections"
            exit 1
          fi
          echo "two audiences, one computation"

      - name: An empty intake exits 2, not 0
        run: |
          set -euo pipefail
          printf 'vendor: ""\n' > empty.yml
          vendorreview check -i empty.yml -o /dev/null -q && rc=0 || rc=$?
          test "$rc" -eq 2 || { echo "expected exit 2 for an empty intake, got $rc"; exit 1; }
          echo "an unfilled form fails loudly"

      - name: A fully evidenced engagement is approved
        run: |
          set -euo pipefail
          cat > clean.yml <<'YML'
          vendor: Northwind Analytics
          service: Read-only dashboards over aggregated internal usage counts.
          requesting_team: Platform Engineering
          owner: Dana Okafor
          stage: negotiating
          hosting: saas
          data_classes: [internal]
          data_subjects: [employees]
          data_residency: Ireland only, stated in the order form.
          cross_border: no
          subprocessors: None; the vendor states it uses no subprocessors.
          retention: Thirty days after termination, then deleted.
          deletion_on_termination: yes
          integrations: [none]
          exposure: restricted
          criticality: routine
          sso_available: yes
          mfa_enforced: yes
          audit_log_export: yes
          admin_roles: Two named platform engineers, reviewed quarterly.
          contract_status: Draft with legal.
          dpa_status: yes
          breach_notification: Twenty-four hours from becoming aware, in writing.
          iso_scope_covers_service: yes
          right_to_audit: yes
          evidence_supplied: [SOC 2 Type II]
          YML
          cat > clean-answers.yml <<'YML'
          sso_saml_oidc: yes
          scim_deprovisioning: yes
          mfa_enforced: yes
          admin_role_separation: yes
          encryption_in_transit: yes
          encryption_at_rest: yes
          key_management: yes
          data_residency_controlled: yes
          retention_policy: yes
          deletion_on_termination: yes
          subprocessor_list_published: yes
          subprocessor_change_notice: yes
          vulnerability_management: yes
          patch_sla: yes
          penetration_test_annual: yes
          secure_development_lifecycle: yes
          dependency_scanning: yes
          audit_log_export: yes
          incident_notification: yes
          incident_response_plan: yes
          business_continuity_plan: yes
          backup_tested: yes
          background_checks: yes
          security_training: yes
          right_to_audit: yes
          vulnerability_disclosure: yes
          YML
          vendorreview check -i clean.yml --responses clean-answers.yml -o clean.md -q && rc=0 || rc=$?
          test "$rc" -eq 0 || { echo "expected exit 0 for a fully evidenced engagement, got $rc"; cat clean.md; exit 1; }
          grep -q "Approve" clean.md
          echo "a fully evidenced engagement is approved and exits 0"

      - name: The catalog and the blank form print
        run: |
          set -euo pipefail
          vendorreview controls -o controls.md -q
          vendorreview questions -o form.yml -q
          grep -q "If not evidenced:" controls.md
          python -c "import yaml,sys; yaml.safe_load(open('form.yml'))"
          echo "the catalog and the blank form are readable and the form parses"
