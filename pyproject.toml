[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vendorreview"
version = "0.1.0"
description = "Third-party security review: what a vendor attests to, what is missing, and what to ask before signing."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Angel De Leon" }]
keywords = [
  "security", "third-party-risk", "vendor-assessment", "tprm", "grc",
  "soc2", "iso27001", "nist-csf", "cis-controls", "due-diligence",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7", "types-PyYAML"]

[project.scripts]
vendorreview = "vendorreview.cli:main"

[project.urls]
Homepage = "https://github.com/angeldeleon/vendorreview"
Repository = "https://github.com/angeldeleon/vendorreview"
Issues = "https://github.com/angeldeleon/vendorreview/issues"
Changelog = "https://github.com/angeldeleon/vendorreview/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/vendorreview"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "S", "SIM", "RUF", "PTH"]
ignore = ["S101", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests plant symlinks, FIFOs and attacker-owned files on purpose, assert raw
# mode bits, and reach into private helpers to test a boundary directly.
"tests/*" = ["S", "PTH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
ignore_missing_imports = true

# PyYAML ships type information through the separate types-PyYAML package, which
# is a dev dependency. Whether mypy resolves it depends on which site-packages it
# is invoked from, and that differs between a venv, a system install and the CI
# image -- so the check fails for reasons that have nothing to do with the code.
# The module is used for one call (yaml.safe_load) whose signature is not in
# doubt.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["import-untyped"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
